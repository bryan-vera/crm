name: Build Container Image
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - custom/main
    tags:
      - "*"

# Image = Frappe + this CRM fork (same ref that triggered the build) + Synergix Sales Intelligence.
# Repository variables (Settings > Secrets and variables > Actions > Variables), optional:
#   SSI_REPO_URL  default https://github.com/bryan-vera/synergix_sales_intelligence
#   SSI_BRANCH    default main
# Repository secret, only if the SSI repository is private:
#   SSI_REPO_TOKEN  fine-grained token with read access to Contents of the SSI repo
# apps.json goes in as a BuildKit secret (not a build-arg) and frappe_docker deletes every .git
# directory after `bench init`, so the token never ends up in the image or its history.

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set apps
        env:
          SSI_REPO_URL: ${{ vars.SSI_REPO_URL || 'https://github.com/bryan-vera/synergix_sales_intelligence' }}
          SSI_BRANCH: ${{ vars.SSI_BRANCH || 'main' }}
          SSI_REPO_TOKEN: ${{ secrets.SSI_REPO_TOKEN }}
        run: |
          ssi_url="$SSI_REPO_URL"
          if [ -n "$SSI_REPO_TOKEN" ]; then
            ssi_url="${SSI_REPO_URL/https:\/\//https://x-access-token:${SSI_REPO_TOKEN}@}"
          fi
          apps_json=$(jq -cn \
            --arg crm "https://github.com/${{ github.repository }}" --arg crm_ref "${{ github.ref_name }}" \
            --arg ssi "$ssi_url" --arg ssi_ref "$SSI_BRANCH" \
            '[{url: $crm, branch: $crm_ref}, {url: $ssi, branch: $ssi_ref}]')
          echo "::add-mask::$apps_json"
          {
            echo "APPS_JSON<<APPS_JSON_EOF"
            echo "$apps_json"
            echo "APPS_JSON_EOF"
          } >> "$GITHUB_ENV"
          echo "FRAPPE_BRANCH=version-15" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          path: builds

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          context: builds
          file: builds/images/layered/Containerfile
          # amd64 only: the old amd64+arm64 matrix pushed both archs to the same tag from separate
          # jobs, so the tag ended up pointing at whichever finished last. Add linux/arm64 here
          # (one job, one multi-arch manifest) only if a server needs it.
          platforms: linux/amd64
          tags: >
            ghcr.io/${{ github.repository }}:${{ github.sha }},
            ghcr.io/${{ github.repository }}:stable
          build-args: |
            FRAPPE_BRANCH=${{ env.FRAPPE_BRANCH }}
          secret-envs: |
            apps_json=APPS_JSON
